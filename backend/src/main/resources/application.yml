server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api/v1
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: yatrify-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yatrify}
    username: ${DB_USERNAME:yatrify_user}
    password: ${DB_PASSWORD:yatrify_pass}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

  cache:
    type: redis
    redis:
      time-to-live: 3600000

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

logging:
  level:
    com.yatrify: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

yatrify:
  generic-platform:
    base-url: ${GENERIC_PLATFORM_URL:http://localhost:8090}
    api-key: ${GENERIC_PLATFORM_API_KEY:generic-platform-key}
    product-code: YATRIFY

  paxaris:
    gateway-url: ${PAXARIS_GATEWAY_URL:http://127.0.0.1:8085}
    realm: ${PAXARIS_REALM:vipultest}
    product-id: ${PAXARIS_PRODUCT_ID:vipultest-admin-product}
    default-user-role: ${PAXARIS_DEFAULT_USER_ROLE:user}
    organizer-role: ${PAXARIS_ORGANIZER_ROLE:prodOrganizer}

  jwt:
    secret: ${JWT_SECRET:yatrify-jwt-secret-key-minimum-256-bits-for-security}
    expiration: 86400000

  aws:
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
    region: ${AWS_REGION:ap-south-1}
    s3-bucket: ${AWS_S3_BUCKET:yatrify-documents}

  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
    max-tokens: 2000

  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}

  cors:
    allowed-origins:
      - http://localhost:4200
      - https://yatrify.com
      - https://www.yatrify.com

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    groups-order: ASC
    operationsSorter: method
  show-actuator: true
